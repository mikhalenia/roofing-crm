name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run-many -t lint typecheck test build --parallel=3

  e2e:
    runs-on: ubuntu-latest
    needs: check
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - name: Check E2E_BASE_URL
        id: gate
        run: |
          if [ -z "$E2E_BASE_URL" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "E2E_BASE_URL not set; skipping e2e"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.gate.outputs.run == 'true'
        run: pnpm nx e2e web-e2e
